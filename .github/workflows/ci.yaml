name: Build, Push to GHCR, and Update Config Repo

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Application Repo
        uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:latest

      - name: Checkout Config Repo
        uses: actions/checkout@v7.0.1
        with:
          repository: '${{ github.actor }}/symfony-app-config'
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo

      - name: Update Image Tag in Config Repo
        run: |
          cd config-repo
          sed -i 's|image: ghcr.io/.*|image: ghcr.io/'${{ github.repository }}':'${{ env.IMAGE_TAG }}'|g' deployment.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add deployment.yaml
          git diff-index --quiet HEAD || (git commit -m "Update symfony image tag to ${{ env.IMAGE_TAG }}" && git push)
